# Qdrant (index RAG) pour Dokploy : une instance par environnement, dans le projet de l'app, sans
# port public. Les instances partagent dokploy-network : chacune y prend l'alias de son env, celui
# que vise QDRANT_URL dans docker-compose.yml (qdrant-prod) et docker-compose.staging.yml
# (qdrant-staging). Onglet Environment de ce service : QDRANT_ALIAS et QDRANT_API_KEY (une clé
# par env, à redonner à l'app).
# En local, utiliser docker-compose.rag.yml.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY requise}
    networks:
      dokploy-network:
        aliases:
          - ${QDRANT_ALIAS:?QDRANT_ALIAS requis (qdrant-staging ou qdrant-prod)}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  qdrant_data:

networks:
  dokploy-network:
    external: true
