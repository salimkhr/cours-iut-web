# ClamAV pour Dokploy : une instance par environnement, dans le projet de l'app. Les instances
# partagent dokploy-network : chacune y prend l'alias de son env, celui que vise CLAMAV_HOST
# dans docker-compose.yml (clamav-prod) et docker-compose.staging.yml (clamav-staging).
# Onglet Environment de ce service : CLAMAV_ALIAS.
services:
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    networks:
      dokploy-network:
        aliases:
          - ${CLAMAV_ALIAS:?CLAMAV_ALIAS requis (clamav-staging ou clamav-prod)}
    volumes:
      - clamav_db:/var/lib/clamav
      - /etc/dokploy/volumes/cours-iut-web-quarantine:/quarantine
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

volumes:
  clamav_db:

networks:
  dokploy-network:
    external: true
